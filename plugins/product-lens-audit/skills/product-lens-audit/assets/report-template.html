<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens-аудит: демо звіту</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;800&family=Sofia+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: an audit report read by a product team, dense and calm
   IDEA an annual-report spread: finding as headline, one solid vermilion mass marks the constraint
   PICTURE the journey funnel with step conversion, the constraint bar in vermilion; then lens radar, journey route, impact/effort matrix
   COLOUR white / black ink, vermilion #ff4a1c for the constraint and top bets, amber for warnings; night on #120d0b
   TYPE Sofia Sans Condensed 800 for titles and figures + Sofia Sans for text (both Cyrillic)
   LAYOUT laptop: title + 4 figures across, funnel full width; then two-column bands. phone: everything stacks, tables become cards */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#120d0b);--ink:light-dark(#111111,#f4efe9);--mute:light-dark(#5d5a57,#b3aca5);--line:light-dark(#e6e2de,#2e2622);--soft:light-dark(#f6f3f0,#1c1512);--red:light-dark(#ff4a1c,#ff6a43);--amber:light-dark(#d98a00,#f2b23a);--ok:light-dark(#111111,#f4efe9)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Sofia Sans",system-ui,sans-serif;overflow-x:clip}
.band{padding-block:clamp(28px,4vw,56px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.num{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(32px,5vw,52px);text-wrap:balance;max-width:20ch}
h2{font-size:clamp(26px,3vw,34px);text-wrap:balance;margin-bottom:8px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:17px;color:var(--mute);margin-top:14px}
.demo{display:inline-block;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:0;margin-top:28px;border-top:2px solid var(--ink)}
.kpi{padding:14px 16px 6px 0}
.kpi .num{font-size:clamp(34px,4.5vw,48px)}
.kpi small{display:block;font-size:13px;color:var(--mute)}
.red{color:var(--red)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px max(5vw,16px)}
.nav a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;padding:10px 12px;border-radius:8px}
.nav a:hover,.nav a:focus-visible{background:var(--soft);outline:none}
.funnel{margin-top:26px}
.step{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 5.5em;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.step .lab{font-size:15px}
.step .lab small{display:block;color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.track{height:30px;background:var(--soft);border-radius:3px;position:relative}
.bar{height:100%;background:var(--ink);border-radius:3px;transform-origin:left;animation:grow .9s ease-out both}
.step.hot .bar{background:var(--red)}
.step.hot .lab{font-weight:700}
.pct{font-family:"Sofia Sans Condensed",sans-serif;font-weight:800;font-size:24px;text-align:right;white-space:nowrap}
.note{position:absolute;left:calc(var(--w) + 10px);top:50%;transform:translateY(-50%);font-size:13px;color:var(--red);font-weight:700;white-space:nowrap}
@keyframes grow{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}
.alt{background:var(--soft)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start;margin-top:18px}
.fig{position:relative;min-height:380px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-family:"Sofia Sans",sans-serif;font-size:13px}
.alt svg text{stroke:var(--soft)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.group{margin-bottom:16px}
.group h3{font-size:14px;color:var(--mute);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.lens{display:grid;grid-template-columns:22px minmax(0,9em) minmax(0,1fr) 2.4em;gap:10px;align-items:center;padding:5px 0;font-size:15px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter i.low{background:var(--red)}.meter i.mid{background:var(--amber)}
.lens b{font-family:"Sofia Sans Condensed",sans-serif;font-size:18px;text-align:right}
.route{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));margin-top:26px;position:relative}
.route::before{content:"";position:absolute;left:6%;right:6%;top:21px;height:4px;background:var(--line)}
.stop{position:relative;text-align:center;padding:0 6px}
.dot{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:4px solid var(--bg);background:var(--ink);color:var(--bg);font-weight:800;position:relative}
.alt .dot{border-color:var(--soft)}
.stop.warn .dot{background:var(--amber);color:#111}
.stop.bad .dot{background:var(--red);color:#fff}
.stop h3{font-size:15px}
.stop p{font-size:13px;color:var(--mute);margin:0}
.who{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--mute);margin-top:18px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{font:inherit;font-size:14px;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--ink);padding:8px 8px 6px}
td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.type{font-size:13px;padding:2px 8px;border-radius:4px;white-space:nowrap;border:1px solid var(--ink)}
.type.ex{border-color:var(--red);color:var(--red)}
.ice{display:grid;grid-template-columns:3em minmax(60px,1fr);gap:8px;align-items:center}
.ice .meter i{background:var(--ink)}
tr.top .ice .meter i{background:var(--red)}
tr.top td:first-child{color:var(--red);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.card{border-top:4px solid var(--red);background:var(--bg);padding:18px 18px 8px}
.card .num{font-size:40px;color:var(--red)}
.card dl{margin:10px 0 0;font-size:15px}
.card dt{font-size:13px;color:var(--mute)}
.card dd{margin:0 0 10px}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:15px;margin-top:12px}
.src span:nth-child(even){white-space:nowrap;font-size:13px;font-weight:700}
.st-ok{color:var(--ink)}.st-demo{color:var(--amber)}.st-no{color:var(--red)}
.conf{margin-top:18px}
.conf .meter{height:12px}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
footer{font-size:13px;color:var(--mute)}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}.cards{grid-template-columns:minmax(0,1fr)}}
@media(max-width:1000px){.route{grid-template-columns:minmax(0,1fr)}.route::before{left:21px;right:auto;top:8px;bottom:8px;width:4px;height:auto}.stop{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;text-align:left;padding:0 0 14px}.dot{margin:0}}
.stop h3,.stop p{overflow-wrap:break-word}
@media(max-width:600px){.step{grid-template-columns:minmax(0,1fr) 4.5em}.step .track{grid-column:1/-1;grid-row:2}.note{display:none}table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);color:var(--mute);font-size:13px}.ice{width:9em}}
.seg{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;margin-top:26px}
.seg i{height:56px;border-radius:3px;background:var(--ink)}
.seg i.p{background:var(--amber)}
.seg i.n{background:transparent;border:2px solid var(--red)}
.checks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 40px;margin-top:18px}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk small{display:block;color:var(--mute);font-size:13px}
.mk{width:20px;height:20px;border-radius:50%;margin-top:2px;background:var(--ink)}
.mk.p{background:var(--amber)}.mk.n{background:transparent;border:2px solid var(--red)}
.st-pend{color:var(--amber)}
@media(max-width:700px){.checks{grid-template-columns:minmax(0,1fr)}.seg i{height:40px}}
.plan{margin-top:20px;border-top:2px solid var(--ink)}
.plan details{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:0}
.plan summary{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;list-style:none}
.plan summary::-webkit-details-marker{display:none}
.plan summary .num{font-size:26px}
.plan summary .ttl{font-weight:700}
.plan summary .ttl small{display:flex;flex-wrap:wrap;gap:6px 12px;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.plan summary .arr{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s}
.plan details[open] .arr{transform:rotate(180deg)}
.plan .top .num{color:var(--red)}
.pbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 36px;padding:0 0 18px 3.4em}
.pbody h4{font-size:13px;color:var(--mute);font-weight:600;margin:10px 0 4px}
.pbody p,.pbody li{font-size:15px}
.pbody ol{margin:0;padding-left:1.2em}
.pbody li{margin-bottom:4px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin-top:10px}
.facts dt{color:var(--mute);font-size:13px;padding-top:2px}
.facts dd{margin:0}
.tools{display:flex;justify-content:flex-end;margin-top:-6px}
@media(prefers-reduced-motion:reduce){.plan summary .arr{transition:none}}
@media(max-width:700px){.pbody{grid-template-columns:minmax(0,1fr);padding-left:0}}
.t{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:help;text-decoration:underline dotted color-mix(in srgb,var(--ink) 55%,transparent);text-underline-offset:3px}
.t:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
#tip{position:fixed;z-index:20;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;padding:10px 12px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
#tip b{display:block;margin-bottom:2px}
.gloss{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr);gap:6px 20px;font-size:15px;margin-top:12px}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--mute)}
@media(max-width:600px){.gloss{grid-template-columns:minmax(0,1fr)}.gloss dd{margin-bottom:8px}}
.stage{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.st-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:10px}
.st{font-size:14px;text-align:center;padding:8px 4px;border-radius:3px;background:var(--soft);color:var(--mute)}
.st.past{background:color-mix(in srgb,var(--ink) 14%,var(--bg));color:var(--ink)}
.st.cur{background:var(--ink);color:var(--bg);font-weight:700}
.stage p{font-size:15px;margin:0}
.ev{display:inline-block;font-size:12px;line-height:1.3;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;vertical-align:1px}
.ev.hyp{border-style:dashed}
.answers{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 16px;font-size:15px;margin:6px 0 0}
.answers dt{color:var(--mute);font-size:14px}
.answers dd{margin:0}
.answers dd.skip{color:var(--amber)}
.pbody ul{margin:0;padding-left:1.2em}
@media(max-width:600px){.st{font-size:13px;padding:6px 2px}.answers{grid-template-columns:minmax(0,1fr)}.answers dd{margin-bottom:6px}}
.cv{display:block;min-width:0}
@media(max-width:600px){.stack td{align-items:flex-start}.stack td .cv{text-align:right}.stack td:nth-child(2) .cv{text-align:left;flex:1}.stack td::before{flex:none}.ev{margin-top:4px}}
.icef{display:none;font-weight:400;color:var(--mute);font-size:13px}
@media(max-width:600px){.stack td:nth-child(5),.stack td:nth-child(6),.stack td:nth-child(7){display:none}.icef{display:inline}.ice{width:auto;grid-template-columns:auto minmax(70px,8em)}.ice b{white-space:nowrap}}
.step.nd .track{background:repeating-linear-gradient(135deg,var(--soft) 0 8px,transparent 8px 14px);border:1px dashed var(--line);display:flex;align-items:center;padding-left:10px}
.ndl{font-size:13px;color:var(--mute)}
.step.nd .pct{color:var(--mute)}
.step.nd .note{position:static;transform:none;margin-left:14px}
.demo{border-radius:12px}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<header class="band"><div class="wrap">
<span class="demo" data-t="label"></span>
<h1 data-t="headline"></h1>
<p class="lead" data-t="lead"></p>
<div class="kpis" id="kpis"></div>
<div class="funnel" id="funnel" data-i18n-aria="aFunnel" aria-label=""></div>
<p class="lead" style="font-size:14px" data-t="funnelNote"></p>
<div class="stage" id="stage" data-i18n-aria="aStage" aria-label=""></div>
</div></header>

<nav class="nav" data-i18n-aria="aNav" aria-label="">
<a href="#lenses" data-i18n="navLenses"></a><a href="#journey" data-i18n="navJourney"></a><a href="#matrix" data-i18n="navMatrix"></a><a href="#ops" data-i18n="navOps"></a><a href="#next" data-i18n="navNext"></a><a href="#plan" data-i18n="navPlan"></a><a href="#data" data-i18n="navData"></a>
</nav>
<div id="tip" role="tooltip"></div>

<section class="band alt" id="lenses"><div class="wrap">
<h2 data-t="lensesH"></h2>
<p data-t="lensesP"></p>
<div class="two">
<div class="fig" id="radar" role="img" data-i18n-aria="aRadar" aria-label=""></div>
<div id="lensList"></div>
</div>
</div></section>

<section class="band" id="journey"><div class="wrap">
<h2 data-t="journeyH"></h2>
<p data-t="journeyP"></p>
<div class="route" id="route"></div>
<div class="legend"><span style="--c:var(--ink)" data-i18n="lgOk"></span><span style="--c:var(--amber)" data-i18n="lgWarn"></span><span style="--c:var(--red)" data-i18n="lgBad"></span></div>
</div></section>

<section class="band alt" id="matrix"><div class="wrap">
<h2 data-t="matrixH"></h2>
<p data-t="matrixP"></p>
<div class="fig" id="mx" style="min-height:420px" role="img" data-i18n-aria="aMatrix" aria-label=""></div>

<p data-t="opsP"></p>

document.getElementById("route").innerHTML=route.map((r,i)=>`<div class="stop ${r.st}"><div class="dot">${i+1}</div><div><span class="who">${r.w}</span><h3>${r.t}</h3><p>${r.p}</p></div></div>`).join("");
const tb=document.getElementById("tbody");
const wrapCells=()=>tb.querySelectorAll("td").forEach(td=>{if(td.firstElementChild&&td.firstElementChild.classList.contains("cv")&&td.childNodes.length==1)return;const s=document.createElement("span");s.className="cv";while(td.firstChild)s.append(td.firstChild);td.append(s)});
const renderTable=f=>{tb.innerHTML=sorted.filter(o=>f=="all"||o.x==f).map(o=>`<tr class="${top3.includes(o.id)?"top":""}"><td class="n">${o.id}</td><td>${o.t} <span class="ev ${o.ev}">${o.ev=="obs"?L.obs:L.hyp}</span></td><td><span class="tag">${ic(o.l)}${o.ln}</span></td><td><span class="type ${o.x}">${o.x=="ex"?L.ex:L.opt}</span></td><td class="n">${o.I}</td><td class="n">${o.C}</td><td class="n">${o.E}</td><td><div class="ice"><b class="n">${o.ice}<small class="icef"> = ${o.I}×${o.C}×${o.E}</small></b><div class="meter"><i style="width:${o.ice/sorted[0].ice*100}%"></i></div></div></td></tr>`).join("")};
renderTable("all");
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));renderTable(b.dataset.f);wrapTerms(tb);wrapCells()}));
document.getElementById("cards").innerHTML=top3.map(id=>{const o=ops.find(x=>x.id==id),p=plans[id]||{};return `<article class="card"><div class="num">#${id}</div><h3>${o.t}</h3><span class="tag" style="color:var(--mute)">${ic(o.l)}${o.ln} · ICE ${o.ice}</span><dl>${p.h?`<dt>${L.hypo}</dt><dd>${p.h}</dd>`:""}${p.m?`<dt>${L.metricOk}</dt><dd>${p.m}</dd>`:""}${p.t?`<dt>${L.test}</dt><dd>${p.t}</dd>`:""}</dl></article>`}).join("");
document.getElementById("planList").innerHTML=sorted.map(o=>{const d={why:"",steps:[],metric:"",effort:"",risk:"",...detail[o.id]},t=top3.includes(o.id);return `<details class="${t?"top":""}"${t?" open":""}><summary><span class="num">${o.id}</span><span class="ttl">${o.t}<small><span class="tag">${ic(o.l)}${o.ln}</span><span>ICE ${o.ice}</span><span>${o.x=="ex"?L.ex:L.opt}</span><span>${d.effort}</span><span class="ev ${o.ev}">${o.ev=="obs"?L.obs:L.hyp}</span></small></span><span class="arr" aria-hidden="true">▾</span></summary><div class="pbody"><div><h4>${L.why}</h4><p>${d.why}</p><dl class="facts"><dt>${L.metric}</dt><dd>${d.metric}</dd><dt>${L.effort}</dt><dd>${d.effort}</dd><dt>${L.risk}</dt><dd>${d.risk}</dd>${d.rtype?`<dt>${L.rtype}</dt><dd>${d.rtype}</dd><dt>${L.thr}</dt><dd>${d.thr}</dd>`:""}</dl>${d.pm?`<h4>${L.pm}</h4><p>${d.pm}</p>`:""}</div><div><h4>${L.todo}</h4><ol>${d.steps.map(s=>`<li>${s}</li>`).join("")}</ol>${d.alt?`<h4>${L.alt}</h4><ul>${d.alt.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}${d.copy?`<h4>${L.copy}</h4><ul>${d.copy.map(s=>`<li>${s}</li>`).join("")}</ul>`:""}</div></div></details>`}).join("");
const tg=document.getElementById("toggleAll");
tg.addEventListener("click",()=>{const open=tg.getAttribute("aria-pressed")!="true";document.querySelectorAll("#planList details").forEach(d=>d.open=open);tg.setAttribute("aria-pressed",open);tg.textContent=open?L.collapse:L.expand});
document.getElementById("src").innerHTML=sources.map(s=>`<span>${s[0]}</span><span class="st-${s[2]}">${s[1]}</span>`).join("");
const cb=document.getElementById("confBar");cb.style.width=conf+"%";cb.className=conf<40?"low":conf<70?"mid":"";
document.getElementById("confNum").textContent=conf+"%";
const keys=Object.keys(GL).sort((a,b)=>b.length-a.length);
const rx=new RegExp("(?<![A-Za-zА-Яа-яІіЇїЄєҐґ0-9])("+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![A-Za-zА-Яа-яІіЇїЄєҐґ0-9])","g");
const wrapTerms=root=>{root.querySelectorAll("p,li,td,dd,h3,.lab,.ttl").forEach(el=>{if(el.closest("nav,svg,.chips,#tip,.gloss,summary .tag"))return;const seen=new Set();const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest(".t,code,svg,button")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const nodes=[];while(w.nextNode())nodes.push(w.currentNode);nodes.forEach(n=>{const s=n.nodeValue;rx.lastIndex=0;if(!rx.test(s))return;rx.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;while(m=rx.exec(s)){const k=m[1];if(seen.has(k))continue;seen.add(k);f.append(s.slice(last,m.index));const b=document.createElement("button");b.className="t";b.type="button";b.dataset.k=k;b.dataset.g=GL[k].g;b.textContent=k;f.append(b);last=m.index+k.length}if(last){f.append(s.slice(last));n.replaceWith(f)}})})};
wrapTerms(document.body);
wrapCells();
document.getElementById("gloss").innerHTML=Object.keys(GL).sort((a,b)=>a.localeCompare(b)).map(k=>`<dt>${esc(k)}</dt><dd>${GL[k].d}</dd>`).join("");
const tip=document.getElementById("tip");let tipFor=null,y0=0;
const showTip=b=>{const k=b.dataset.k;tip.innerHTML=`<b>${esc(k)} — ${GL[k].g}</b>${GL[k].d}`;tip.style.display="block";const r=b.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;let x=Math.min(Math.max(16,r.left),innerWidth-tw-16),y=r.bottom+8;if(y+th>innerHeight-8)y=r.top-th-8;tip.style.left=x+"px";tip.style.top=y+"px";tipFor=b;y0=scrollY;b.setAttribute("aria-describedby","tip")};
const hideTip=()=>{tip.style.display="none";if(tipFor)tipFor.removeAttribute("aria-describedby");tipFor=null};
document.addEventListener("click",e=>{const b=e.target.closest(".t");if(b){e.preventDefault();e.stopPropagation();(tipFor===b&&!matchMedia("(hover:hover) and (pointer:fine)").matches)?hideTip():showTip(b)}else hideTip()});
document.addEventListener("mouseover",e=>{const b=e.target.closest(".t");if(b&&matchMedia("(hover:hover) and (pointer:fine)").matches)showTip(b)});
document.addEventListener("mouseout",e=>{const b=e.target.closest(".t");if(b&&matchMedia("(hover:hover) and (pointer:fine)").matches&&!b.contains(e.relatedTarget))hideTip()});
document.addEventListener("focusin",e=>{const b=e.target.closest(".t");if(b&&b.matches(":focus-visible"))showTip(b);else if(!b)hideTip()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});
addEventListener("scroll",()=>{if(tipFor&&Math.abs(scrollY-y0)>40)hideTip()},{passive:true});

const rd=document.getElementById("radar");
const drawRadar=()=>{const W=rd.clientWidth,H=rd.clientHeight,cx=W/2,cy=H/2,R=Math.min(W,H)/2-(W<420?44:62),N=lenses.length;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 let s="";[25,50,75,100].forEach(v=>{s+=`<polygon points="${lenses.map((_,i)=>pt(i,R*v/100).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`});
 lenses.forEach((_,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
 s+=`<polygon points="${lenses.map((l,i)=>pt(i,R*l.s/100).join(",")).join(" ")}" fill="var(--ink)" fill-opacity=".12" stroke="var(--ink)" stroke-width="2"/>`;
 lenses.forEach((l,i)=>{const[x,y]=pt(i,R*l.s/100);s+=`<circle cx="${x}" cy="${y}" r="${l.s<40?6:4}" fill="${l.s<40?"var(--red)":"var(--ink)"}"/>`;
  const[lx,ly]=pt(i,R+16);const anc=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
  s+=`<text x="${lx}" y="${ly+4}" text-anchor="${anc}" fill="${l.s<40?"var(--red)":"var(--mute)"}" font-weight="${l.s<40?700:400}">${l.k}</text>`});
 s+=`<text x="${cx}" y="${cy-R*.25-4}" text-anchor="middle" fill="var(--mute)">25</text><text x="${cx}" y="${cy-R*.75-4}" text-anchor="middle" fill="var(--mute)">75</text>`;
 rd.innerHTML=`<svg>${s}</svg>`};
const roR=new ResizeObserver(drawRadar);roR.observe(rd);
const mx=document.getElementById("mx");
const drawMx=()=>{const W=mx.clientWidth,H=mx.clientHeight,m={l:48,r:16,t:16,b:44},pw=W-m.l-m.r,ph=H-m.t-m.b;
 const X=e=>m.l+(e-.5)/10*pw,Y=i=>m.t+ph-(i-.5)/10*ph,midX=X(5.5),midY=Y(5.5);
 let s=`<rect x="${m.l}" y="${m.t}" width="${midX-m.l}" height="${midY-m.t}" fill="var(--red)" fill-opacity=".08"/>`;
 s+=`<line x1="${midX}" y1="${m.t}" x2="${midX}" y2="${m.t+ph}" stroke="var(--mute)" stroke-dasharray="4 4"/><line x1="${m.l}" y1="${midY}" x2="${m.l+pw}" y2="${midY}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
 s+=`<line x1="${m.l}" y1="${m.t+ph}" x2="${m.l+pw}" y2="${m.t+ph}" stroke="var(--ink)"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ph}" stroke="var(--ink)"/>`;
 const q=[[L.qWin,m.l+8,m.t+18,"start","var(--red)"],[L.qBig,m.l+pw-8,m.t+18,"end","var(--mute)"],[L.qSmall,m.l+8,m.t+ph-10,"start","var(--mute)"],[L.qPit,m.l+pw-8,m.t+ph-10,"end","var(--mute)"]];
 q.forEach(a=>s+=`<text x="${a[1]}" y="${a[2]}" text-anchor="${a[3]}" fill="${a[4]}" font-weight="700">${a[0]}</text>`);
 s+=`<text x="${m.l+pw/2}" y="${H-10}" text-anchor="middle" fill="var(--mute)">${L.axE}</text><text transform="translate(16 ${m.t+ph/2}) rotate(-90)" text-anchor="middle" fill="var(--mute)">${L.axI}</text>`;
 const r=W<520?11:14;
 const grp={};ops.forEach(o=>(grp[o.eff+"_"+o.I]=grp[o.eff+"_"+o.I]||[]).push(o.id));
 ops.forEach(o=>{const g=grp[o.eff+"_"+o.I],j=g.indexOf(o.id),a=g.length>1?2*Math.PI*j/g.length-Math.PI/2:0,sp=g.length>1?r*1.15:0,x=X(o.eff)+Math.cos(a)*sp,y=Y(o.I)+Math.sin(a)*sp,ex=o.x=="ex",hot=top3.includes(o.id);
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${ex?"var(--bg)":hot?"var(--red)":"var(--ink)"}" stroke="${ex?"var(--red)":"none"}" stroke-width="2.5"/><text x="${x}" y="${y+4.5}" text-anchor="middle" fill="${ex?"var(--red)":"var(--bg)"}" style="stroke:none" font-weight="700">${o.id}</text>`});
 mx.innerHTML=`<svg>${s}</svg>`};
const roM=new ResizeObserver(drawMx);roM.observe(mx);
}
</script>
</body>

</html>
